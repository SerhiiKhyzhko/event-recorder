<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Activity Console</title>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">

const { useState } = React;

const API_URL = "http://localhost:8080"; 

function App() {
  const [events, setEvents] = useState([]);
  const [error, setError] = useState("");

  async function loadEvents(e) {
    e.preventDefault(); 

    const form = e.target;
    const userId = form.userId.value;
    const from = new Date(form.start.value).toISOString();
    const to = new Date(form.end.value).toISOString();

    const res = await fetch(
      API_URL + "/events?user_id=" + userId + "&start_date=" + from + "&end_date=" + to
    );

    if (!res.ok) {
      setError("request failed: " + res.status);
      return;
    }

    setEvents(await res.json() || []); 
    setError("");
  }

  return (
    <div>
      <form onSubmit={loadEvents}>
        user_id: <input name="userId" /><br />
        from: <input name="start" type="datetime-local" /><br />
        to: <input name="end" type="datetime-local" /><br />
        <button type="submit">Load events</button>
      </form>

      {error && <p>{error}</p>}

      <ul>
        {events.map((ev) => (
          <li key={ev.id}>{ev.created_at} — {ev.action} — {JSON.stringify(ev.metadata)}</li>
        ))}
      </ul>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
